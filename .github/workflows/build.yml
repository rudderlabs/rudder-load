name: builds
on:
  release:
    types: [ created ]
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true
env:
  arch_amd64: amd64
  arch_arm64: arm64
  docker_images: |
    name=rudderstack/rudder-load
  docker_tags: |
    type=ref,event=branch
    type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
    type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
    type=raw,value=latest,enable=${{ github.event_name == 'release' }}
    type=semver,pattern={{version}},enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
    type=semver,pattern={{major}},enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
    type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}

permissions: {}

jobs:
  docker-meta:
    # Dependabot and fork PRs get no secrets, so they cannot log in to DockerHub: skip the build instead of failing it.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      labels: ${{ steps.meta.outputs.labels }}
      build-date: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
      version: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
      revision: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
      tags: ${{ steps.meta.outputs.tags }}
      arm64_tags: ${{ steps.arm64_meta.outputs.tags }}
      arm64_labels: ${{ steps.arm64_meta.outputs.labels }}
      amd64_tags: ${{ steps.amd64_meta.outputs.tags }}
      amd64_labels: ${{ steps.amd64_meta.outputs.labels }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.docker_images }}
          tags: ${{ env.docker_tags }}
      - name: Docker arm64 meta
        id: arm64_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.docker_images }}
          tags: ${{ env.docker_tags }}
          flavor: |
            suffix=-${{ env.arch_arm64 }},onlatest=true
      - name: Docker amd64 meta
        id: amd64_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.docker_images }}
          tags: ${{ env.docker_tags }}
          flavor: |
            suffix=-${{ env.arch_amd64 }},onlatest=true
  docker:
    needs:
      - docker-meta
    strategy:
      matrix:
        build-config:
          - os: arc-arm64
            tags: ${{ needs.docker-meta.outputs.arm64_tags }}
            labels: ${{ needs.docker-meta.outputs.arm64_labels }}
            platform: linux/arm64
          - os: ubuntu-latest
            tags: ${{ needs.docker-meta.outputs.amd64_tags }}
            labels: ${{ needs.docker-meta.outputs.amd64_labels }}
            platform: linux/amd64
    runs-on: ${{ matrix.build-config.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: rudderlabs
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Scans the built image for secrets (TruffleHog) before pushing it.
      - name: Build, scan and push
        uses: rudderlabs/build-scan-push-action@865b4253caa57f8f20cd109e0efc1affe3a64939 # v2.2.0
        with:
          context: .
          platforms: ${{ matrix.build-config.platform }}
          push: true
          tags: ${{ matrix.build-config.tags }}
          labels: ${{ matrix.build-config.labels }}
          build-args: |
            BUILD_DATE=${{ needs.docker-meta.outputs.build-date }}
            VERSION=${{ needs.docker-meta.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
            REVISION=${{ needs.docker-meta.outputs.revision }}
  create-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ docker, docker-meta ]
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: rudderlabs
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Tags are passed through env rather than ${{ }} so that a crafted branch name (it ends up in a tag) cannot
      # inject shell commands.
      - name: Create multi-arch manifest for Docker
        env:
          MANIFEST_TAGS: ${{ needs.docker-meta.outputs.tags }}
        run: |
          while read -r tag; do
            [ -z "$tag" ] && continue
            arm_tag="${tag}-${arch_arm64}"
            amd_tag="${tag}-${arch_amd64}"
            echo "Creating manifest: $tag from $arm_tag and $amd_tag"
            docker buildx imagetools create -t "$tag" "$arm_tag" "$amd_tag"
          done <<< "$MANIFEST_TAGS"
